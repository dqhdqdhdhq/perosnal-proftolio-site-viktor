# Temporary helper: fetches the Satoshi webfont from Fontshare on a GitHub
# runner (this sandbox can't reach api.fontshare.com). Removed once the
# redesign ships. Satoshi is free for personal & commercial use under the
# ITF Free Font License via Fontshare.
name: fetch-fonts
on:
  push:
    branches: [claude/zealous-archimedes-xif1vc]
    paths: ['.github/workflows/fetch-fonts.yml']
permissions:
  contents: write
concurrency:
  group: fetch-fonts
  cancel-in-progress: true
jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Satoshi variable woff2 from Fontshare
        run: |
          mkdir -p _reference/fonts
          css=$(curl -fsSL -A "Mozilla/5.0" "https://api.fontshare.com/v2/css?f[]=satoshi@1,2&display=swap")
          echo "$css" > _reference/fonts/satoshi.css
          # URLs are protocol-relative (//cdn.fontshare.com/...) — add https:
          n=0
          echo "$css" | grep -oE "//[^)']+\.woff2" | sort -u | while read -r u; do
            n=$((n+1))
            f="_reference/fonts/satoshi-$n.woff2"
            curl -fsSL -A "Mozilla/5.0" "https:$u" -o "$f"
            echo "$u -> $f"; ls -la "$f"
          done
      - name: Commit fonts back
        run: |
          git config user.name "reference-bot"
          git config user.email "reference-bot@users.noreply.github.com"
          git add _reference/fonts
          git commit -m "Add Satoshi webfont files [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
