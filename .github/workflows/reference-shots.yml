# Temporary helper: captures reference-site screenshots on a GitHub runner
# (this sandbox can't reach the sites). Removed once the redesign ships.
name: reference-shots
on:
  push:
    branches: [claude/zealous-archimedes-xif1vc]
    paths: ['_reference/capture.cjs', '.github/workflows/reference-shots.yml']
permissions:
  contents: write
concurrency:
  group: reference-shots
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node _reference/capture.cjs
      - name: Commit screenshots back
        run: |
          rm -f package.json package-lock.json
          git config user.name "reference-bot"
          git config user.email "reference-bot@users.noreply.github.com"
          git add _reference/shots
          git commit -m "Add reference screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
