<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Lost in space</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23E34400'/%3E%3Cpath d='M6.2 7h3l2.8 7.4L14.8 7h3l-4.4 10.6h-2.8L6.2 7Z' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var saved = localStorage.getItem('viktor-theme');
        if (saved === 'day') saved = 'light';
        if (saved === 'night') saved = 'dark';
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lost {
      min-height: 100svh;
      display: grid; place-content: center; justify-items: center;
      text-align: center; gap: 1.1rem;
      padding: var(--gutter);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.5px);
      background-size: 18px 18px;
    }
    .lost__code {
      font-size: clamp(5rem, 22vw, 10rem); font-weight: 500; line-height: 1;
      letter-spacing: -0.05em;
    }
    .lost__code em {
      font-family: var(--serif); font-style: italic; font-weight: 400;
      color: var(--accent);
    }
    .lost__astro { width: clamp(110px, 22vw, 160px); animation: lost-drift 7s ease-in-out infinite; }
    @keyframes lost-drift {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-18px) rotate(6deg); }
    }
    .lost p { color: var(--ink-2); max-width: 34ch; }
  </style>
</head>
<body>
  <main class="lost">
    <svg class="lost__astro" viewBox="0 0 320 340" role="img" aria-label="A small astronaut, drifting">
      <line x1="160" y1="52" x2="160" y2="30" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="160" cy="24" r="5" fill="var(--accent)"/>
      <circle cx="160" cy="140" r="88" fill="none" stroke="var(--ink)" stroke-width="3"/>
      <path d="M104 124a56 48 0 0 1 112 0v20a56 48 0 0 1-112 0Z" fill="var(--dark)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="138" cy="138" r="9" fill="#f6f4f2"/>
      <circle cx="182" cy="138" r="9" fill="#f6f4f2"/>
      <path d="M146 166q14 -8 28 0" fill="none" stroke="#f6f4f2" stroke-width="3" stroke-linecap="round"/>
      <path d="M104 226c-20 10-32 26-34 50M216 226c20 10 32 26 34 50" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <path d="M118 232v22a14 14 0 0 0 14 14h56a14 14 0 0 0 14-14v-22" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1 class="lost__code">4<em>0</em>4</h1>
    <p>This page drifted out of orbit. Mission control suggests heading back to base.</p>
    <a class="btn btn--primary" href="./">
      <span>Back to base</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(180deg)"><path d="M12 4v14m0 0 6-6m-6 6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </main>
</body>
</html>
