<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Lost in space</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12C8 11 11 8 12 0Z'/%3E%3C/svg%3E" />
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var saved = localStorage.getItem('viktor-theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lost {
      min-height: 100svh;
      display: grid; place-content: center; justify-items: center;
      text-align: center; gap: 1.2rem;
      padding: var(--gutter);
    }
    .lost__code {
      font-size: clamp(5rem, 22vw, 11rem); font-weight: 700; line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      letter-spacing: -0.04em;
    }
    .lost__astro { width: clamp(110px, 22vw, 170px); animation: lost-drift 7s ease-in-out infinite; }
    @keyframes lost-drift {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-18px) rotate(6deg); }
    }
    .lost p { color: var(--text-2); max-width: 34ch; }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true">
    <div class="aurora__blob aurora__blob--1"></div>
    <div class="aurora__blob aurora__blob--2"></div>
  </div>

  <main class="lost">
    <svg class="lost__astro" viewBox="0 0 320 340" role="img" aria-label="A small astronaut, drifting">
      <line x1="160" y1="52" x2="160" y2="30" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="160" cy="24" r="5" fill="var(--accent-2)"/>
      <circle cx="160" cy="140" r="88" fill="none" stroke="var(--text)" stroke-width="3"/>
      <path d="M104 124a56 48 0 0 1 112 0v20a56 48 0 0 1-112 0Z" fill="#0d1326" stroke="var(--text)" stroke-width="3"/>
      <circle cx="138" cy="138" r="9" fill="#f3f6ff"/>
      <circle cx="182" cy="138" r="9" fill="#f3f6ff"/>
      <path d="M146 166q14 -8 28 0" fill="none" stroke="#f3f6ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M104 226c-20 10-32 26-34 50M216 226c20 10 32 26 34 50" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
      <path d="M118 232v22a14 14 0 0 0 14 14h56a14 14 0 0 0 14-14v-22" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1 class="lost__code">404</h1>
    <p>This page drifted out of orbit. Mission control suggests heading back to base.</p>
    <a class="btn btn--primary" href="./">
      <span>Return to Earth</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(180deg)"><path d="M12 4v14m0 0 6-6m-6 6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
